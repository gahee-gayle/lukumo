  :root{
    --ink:#12131f; --ink-2:#454a63; --muted:#868ca4; --line:#e8eaf1; --line-2:#f2f3f9;
    --bg:#fff; --bg-soft:#f6f7f8; --accent:#00b488; --accent-2:#009b74; --accent-soft:#e0f5ef;
    --green:#00b488; --pink:#ff5a86; --amber:#ff9f2e; --ink-blue:#0f1012;
    --blue:#2F6FED; --blue-text:#2563EB; --blue-soft:#e9f1fe; --accent-glow:rgba(0,180,136,.30); --accent-line:#c7e6d4;
    --red:#e0483d; --red-soft:#fdecea;
    --shadow:0 1px 2px rgba(18,19,31,.04),0 8px 24px rgba(18,19,31,.06);
    --shadow-lg:0 24px 60px rgba(18,19,31,.18);
    --radius:16px; --radius-lg:24px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
  a{color:inherit;text-decoration:none}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;font-weight:600;font-size:15px;transition:.16s ease;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),0 8px 22px var(--accent-glow)}
  .btn-ghost{background:var(--bg-soft);color:var(--ink)}
  .btn-ghost:hover{background:#eceef6}
  .btn-outline{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
  .btn-outline:hover{box-shadow:inset 0 0 0 1.5px #cfd3e6}
  .btn-dark{background:var(--ink-blue);color:#fff}
  .btn-dark:hover{background:#100d2e}
  .btn-sm{height:42px;padding:0 20px;font-size:15px;border-radius:10px}
  .btn-lg{height:52px;padding:0 26px;font-size:16px;border-radius:14px}
  .btn-block{width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .ns-cat-menu.open{display:block;animation:pop .14s ease}
  .ns-cat-menu button{display:block;width:100%;text-align:left;padding:10px 12px;font-weight:600;font-size:14.5px;color:var(--ink)}
  .ns-cat-menu button:hover{background:var(--bg-soft)}
  .ns-cat-menu button.sel{color:var(--accent)}
  .ns-go{width:40px;height:40px;border-radius:50% !important;background:var(--accent);display:grid;place-items:center;margin-left:8px;flex-shrink:0;transition:.14s}
  .ns-go:hover{background:#009b74}
  @media(max-width:1120px){.nav-search.big{display:none}}

  /* dribbble-round controls (pill) */
  .btn{border-radius:999px !important}
  .land-nav a,.pill-filter{border-radius:999px !important}

  .ns-cat-menu,.menu-pop{border-radius:14px !important}

  .auth-plain{min-height:100vh;display:flex;flex-direction:column;background:#fff}
  .auth-topbar{padding:22px 28px}
  .auth-topbar.row{display:flex;align-items:center;justify-content:space-between}
  .auth-back{color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .auth-back:hover{color:var(--ink)}
  .auth-center{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 24px 96px}
  .auth-card{width:100%;max-width:400px;text-align:center}
  .auth-card .field,.auth-card .roles{text-align:left}
  .social-col{display:flex;flex-direction:column;gap:10px}
  .social-btn{gap:10px;font-weight:600}
  .social-btn svg{flex-shrink:0}
  .role{display:flex;flex-direction:column;border-radius:14px !important;padding:0 !important;overflow:hidden;border:2px solid var(--line);background:#fff;transition:.15s}
  .role .role-body{flex:1}
  .role:hover{border-color:var(--ink-2)}
  .role-head{font-weight:800;font-size:15px;padding:11px 14px;text-align:left}
  .role .role-head{background:#00b488;color:#fff}
  .role.role-accepted .role-head{background:var(--blue);color:#fff}
  .role.role-expert .role-head{background:#5b3fd6;color:#fff}
  .role .role-tag{opacity:.9}
  .role-body{padding:12px 14px;background:#fff}
  .role-body p{color:var(--ink-2);font-size:13px;line-height:1.5;margin:0}
  .role.sel{border-color:var(--accent)}
  .role.role-accepted.sel{border-color:var(--blue)}
  .role.role-expert.sel{border-color:#5b3fd6}
  .roles-3{grid-template-columns:1fr 1fr 1fr;gap:14px;width:min(720px,94vw);margin-left:50%;transform:translateX(-50%)}
  @media(max-width:560px){.roles-3{grid-template-columns:1fr;width:100%;margin-left:0;transform:none}}
  .roles-2{grid-template-columns:1fr 1fr;gap:14px;width:min(560px,94vw);margin-left:50%;transform:translateX(-50%)}
  @media(max-width:560px){.roles-2{grid-template-columns:1fr;width:100%;margin-left:0;transform:none}}
  .role-expert-cta{display:block;width:min(560px,94vw);margin-left:50%;transform:translateX(-50%);text-align:center;background:#fff;color:#5b3fd6;border:2px solid #5b3fd6;border-radius:14px !important;padding:14px 18px;cursor:pointer;transition:.15s;margin-bottom:20px;font-weight:800;font-size:14.5px}
  .role-expert-cta:hover{background:#5b3fd6;color:#fff}
  @media(max-width:560px){.role-expert-cta{width:100%;margin-left:0;transform:none}}

  .ei-cta:hover{background:#4c33bd;color:#fff}
  .ei-rows{display:flex;flex-direction:column;gap:16px;margin:8px 0 20px}
  .ei-row{display:flex;gap:14px;align-items:flex-start}
  .ei-ico{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:#f0ecff;display:grid;place-items:center;font-size:20px}
  .ei-row b{font-size:15px;font-weight:800}
  .ei-row p{color:var(--ink-2);font-size:13.5px;line-height:1.55;margin:3px 0 0}
  .ei-badge{display:inline-block;background:#efeaff;color:#5b3fd6;font-weight:800;font-size:13px;padding:5px 14px;border-radius:999px}
  .ei-note{background:#f6f4ff;border:1px solid #e6e0ff;border-radius:12px;padding:11px 14px;color:#5b3fd6;font-size:13px;font-weight:600;text-align:center;margin-bottom:16px}
  .ei-step{color:#5b3fd6;font-weight:700;font-size:12.5px;letter-spacing:.02em}
  .btn-li{display:inline-flex;align-items:center;gap:9px;background:#0a66c2;color:#fff;border:none;border-radius:999px !important;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:.14s}
  .btn-li:hover{background:#095196}
  .btn-li.on{background:#1b7f4b}
  .sess-list{display:flex;flex-direction:column;gap:8px}
  .sess-row{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
  .sess-row .sess-min{font-weight:700;font-size:14px;margin-right:auto}
  .sess-row .sess-cur{color:var(--muted);font-weight:700}
  .sess-price{width:80px;height:38px;padding:0 10px}
  .ex-apply{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:34px;padding:22px 24px;background:var(--accent-soft);border-radius:16px}
  .ex-apply b{font-size:15.5px;display:block}
  .ex-apply span{color:var(--ink-2);font-size:13.5px}
  .role-tag{display:block;font-size:11.5px;font-weight:600;opacity:.8;margin-top:3px;letter-spacing:0}
  .theme-blue{--accent:var(--blue);--accent-2:#1e5fd0;--accent-soft:var(--blue-soft);--accent-glow:rgba(47,111,237,.34);--accent-line:#c3d8fb}
  .theme-blue h1{color:var(--accent)}
  .school-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .school-row .select{flex:1;min-width:0}
  .btn-x{background:none;border:1px solid var(--line);width:40px;height:40px;flex:0 0 auto;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
  .btn-x:hover{border-color:var(--accent);color:var(--accent)}
  .chip.blue{background:var(--blue-soft);color:var(--blue-text)}

  const qp=[];['q','school','major','level'].forEach(k=>{if(params[k])qp.push(k+'='+encodeURIComponent(params[k]));});
  if(qp.length)h+='?'+qp.join('&');
  return h;
}
function hashToRoute(){
  const raw=(location.hash||'').replace(/^#\/?/,'');
  if(!raw)return {name:'landing',params:{}};
  const [path,query]=raw.split('?');
  const seg=path.split('/');
  const params={};
  if(seg[1])params.id=decodeURIComponent(seg[1]);
  if(query)query.split('&').forEach(pair=>{const [k,v]=pair.split('=');if(k)params[k]=decodeURIComponent(v||'');});
  return {name:seg[0]||'landing',params};
}

    :`<div class="empty" style="text-align:left">No saved references yet. <a data-go="home" style="color:var(--accent);cursor:pointer;font-weight:700">Browse portfolios →</a></div>`;

function viewProfile(){
  const u=me();if(u.role==='expert')return viewExpertProfile(u);

  const acc=u.role==='accepted';
  const mine=portfoliosByOwner(u.id);
  const saved=(u.saved||[]).map(id=>DB.portfolios.find(p=>p.id===id)).filter(Boolean);
  const items=acc?mine:saved;
  const themed=acc?' theme-blue':'';
  const L=u.links||{};
  const soc=[];
  if(L.instagram)soc.push(['https://instagram.com/'+String(L.instagram).replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,''),IC_IGC]);
  if(L.linkedin)soc.push(['https://'+String(L.linkedin).replace(/^https?:\/\//,''),IC_LIC]);
  const stat=(ic,label,val)=>`<div class="prof-stat"><span class="l">${ic}<span>${label}</span></span><span class="v">${val}</span></div>`;
  const side=`<aside class="prof-side${themed}">
    <img class="pa" src="${avatarUrl(u)}"/>
    <div class="prof-name">${esc(tc(u.name))}${u.verified?' '+mentorTierBadge(u):''}</div>
    ${u.founding?`<div style="margin-top:7px">${foundingBadge(u)}</div>`:''}
    ${(acc?u.school:(u.targetSchools&&u.targetSchools[0]))?`<div class="prof-school">${esc(acc?u.school:u.targetSchools[0])}</div>`:''}
    ${(acc?u.major:(u.targetMajors&&u.targetMajors[0]))?`<div class="prof-major">${esc(acc?u.major:u.targetMajors[0])}</div>`:''}
    ${u.location?`<div class="prof-loc">${IC_PIN}${esc(u.location)}</div>`:''}
    <div class="prof-actions">${acc
        ?`<button class="btn btn-primary btn-sm theme-blue" data-go="addPortfolio">Add Portfolio</button>`
        :`<button class="btn btn-primary btn-sm" data-go="folder">Admission Folder</button>`}
      <button class="btn btn-outline btn-sm" data-go="editProfile">Edit profile</button>${acc&&!u.verified?`<button class="btn btn-outline btn-sm" data-getverified>Get verified</button>`:''}</div>
    <div class="prof-hr"></div>
    ${soc.length?`<div class="prof-soc">${soc.map(s=>`<a href="${s[0]}" target="_blank" rel="noopener">${s[1]}</a>`).join('')}</div>`:''}
    <div class="prof-hr"></div>

      ${stat(IC_EYE,'View',0)}

      ${stat(IC_FOLLOWING,'Following',0)}
      ${stat(IC_FOLLOWS,'Follows',0)}

  </aside>`;

/* ---------- HOME ---------- */
function stageFor(gradYear,track){
  if(!gradYear)return 'Explore';
  const now=new Date();const grad=new Date(+gradYear,5,1);
  const months=(grad.getFullYear()-now.getFullYear())*12+(grad.getMonth()-now.getMonth());
  if(months<=14)return 'Apply';
  if(months<=26)return 'Build';
  return 'Explore';
}
function userStage(u){if(!u||u.role!=='aspiring')return null;if(u.stageOverride)return u.stageOverride;return stageFor(u.gradYear,u.targetLevel);}
function stageBanner(stage){
  const info={
    Explore:['Explore mode','Get inspired. Browse accepted portfolios and save the schools and styles you love — no pressure yet.'],
    Build:['Build mode','Time to make work. Study how accepted pieces are built and start assembling your own portfolio.'],
    Apply:['Apply mode','It’s go time. Finalize your portfolio, track your schools, and book a review before deadlines.'],
  }[stage]||['Explore mode',''];
  return `<div class="stage-banner"><div><span class="stage-pill">${info[0]}</span><p>${info[1]}</p></div>${stage==='Apply'?`<button class="btn btn-primary btn-sm" data-go="folder">Open My Schools</button>`:(stage==='Build'?`<button class="btn btn-primary btn-sm" data-go="review">Get a review</button>`:'')}</div>`;
}
function viewHome(){
  const st=userStage(me());
  return `<div class="wrap">${st?stageBanner(st):''}${browseBody()}</div>`;
}

function confirmDialog(o){
  const ov=document.createElement('div');ov.className='cf-ov';
  ov.innerHTML=`<div class="cf-card"><h3>${esc(o.title||'Are you sure?')}</h3>${o.body?`<p>${esc(o.body)}</p>`:''}<div class="cf-act"><button class="btn btn-soft btn-lg cf-cancel">${esc(o.cancelText||'Cancel')}</button><button class="btn btn-lg cf-ok ${o.danger===false?'btn-primary':'cf-danger'}">${esc(o.confirmText||'Delete')}</button></div></div>`;
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  const close=()=>{ov.remove();document.body.style.overflow='';document.removeEventListener('keydown',onEsc);};
  function onEsc(e){if(e.key==='Escape')close();}
  document.addEventListener('keydown',onEsc);
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  ov.querySelector('.cf-cancel').onclick=close;
  ov.querySelector('.cf-ok').onclick=()=>{close();if(o.onConfirm)o.onConfirm();};
}

function replaceProjectImages(pid,prid){
  const p=DB.portfolios.find(x=>x.id===pid);if(!p)return;const pr=p.projects.find(x=>x.id===prid);if(!pr)return;
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=async()=>{const imgs=[];for(const f of inp.files){if(f.type.startsWith('image/'))imgs.push(await fileToDataURL(f));}if(imgs.length){const oldFirst=pr.files&&pr.files[0];const wasCover=p.cover&&oldFirst===p.cover;pr.files=imgs;if(wasCover)p.cover=imgs[0];save();toast('Project images replaced');render();}};
  inp.click();
}

  function onEsc(e){if(e.key==='Escape')close();}
  document.addEventListener('keydown',onEsc);
  function saveIt(){pr.title=(data.title||'').trim()||p.major;pr.description=(data.description||'').trim();save();close();toast('Updated');render();}
  function del(){confirmDialog({title:'Delete this project?',body:'This removes the project and its images. This can’t be undone.',confirmText:'Delete',onConfirm:()=>{const wasCover=p.cover&&pr.files&&pr.files.includes(p.cover);p.projects=p.projects.filter(y=>y.id!==prid);if(wasCover){const rem=p.projects.flatMap(y=>y.files||[]);p.cover=rem[0]||null;}save();close();toast('Removed');render();}});}

    ov.innerHTML=`<div class="ww-card">

          <button type="button" class="btn btn-soft btn-lg" data-wprev ${idx===0?'disabled':''}>Previous</button>
          <button type="button" class="btn btn-soft btn-lg" data-wnext ${idx===images.length-1?'disabled':''}>Next</button>
          <button type="button" class="btn btn-primary btn-lg ww-save">Save</button>
        </div>
      </div>
    </div>`;
    const ti=ov.querySelector('.ww-title'),de=ov.querySelector('.ww-desc');
    ti.oninput=()=>data.title=ti.value;
    de.oninput=()=>data.description=de.value;
    ov.querySelectorAll('[data-wprev]').forEach(b=>b.onclick=()=>{if(getIdx()>0){setIdx(getIdx()-1);draw();}});
    ov.querySelectorAll('[data-wnext]').forEach(b=>b.onclick=()=>{if(getIdx()<images.length-1){setIdx(getIdx()+1);draw();}});
    ov.querySelectorAll('[data-wgo]').forEach(b=>b.onclick=()=>{setIdx(+b.dataset.wgo);draw();});
    ov.querySelector('.ww-save').onclick=()=>onSave();
    const del=ov.querySelector('.ww-del');if(del&&onDelete)del.onclick=()=>onDelete();
    const on=ov.querySelector('.ww-film.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
  }
  ov.addEventListener('click',e=>{if(e.target===ov&&onClose)onClose();});
  draw();
}

function openProjectModal(pid,startPrid){
  const p=DB.portfolios.find(x=>x.id===pid);if(!p)return;
  const projs=projectsOf(p);if(!projs.length)return;if(document.querySelector('.pm-ov'))return;
  let idx=Math.max(0,projs.findIndex(x=>x.id===startPrid));

  function onKey(e){if(e.key==='Escape')close();else if(e.key==='ArrowLeft'&&idx>0){idx--;draw();}else if(e.key==='ArrowRight'&&idx<projs.length-1){idx++;draw();}}
  document.addEventListener('keydown',onKey);
  ov.addEventListener('click',e=>{if(e.target.closest('.pm-nav'))return;if(!e.target.closest('.pm-card')&&!e.target.closest('.pm-by'))close();});

    ov.querySelector('[data-pmx]').onclick=close;
    const like=ov.querySelector('[data-pmlike]');if(like)like.onclick=()=>{const on=like.classList.toggle('on');const nEl=like.querySelector('.pm-lkn');if(nEl){nEl.textContent=((+nEl.dataset.base)+(on?1:0)).toLocaleString();}like.classList.add('showcount');clearTimeout(like._t);like._t=setTimeout(()=>like.classList.remove('showcount'),1500);like.setAttribute('aria-pressed',on);};
    const fol=ov.querySelector('.pm-follow');if(fol)fol.onclick=()=>{const f=fol.classList.toggle('following');fol.textContent=f?'Following':'Follow';};
    ov.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>toast('Messaging — coming soon'));
    const post=ov.querySelector('[data-pmpost]');if(post)post.onclick=()=>toast('Comment posted (demo)');

    const nx=ov.querySelector('[data-pmnext]');if(nx)nx.onclick=()=>{if(idx<projs.length-1){idx++;draw();}};
    ov.querySelector('.pm-card').scrollTop=0;
  }
  draw();
}

/* ---------- BLOG ---------- */
const ART_BODY_CLOSE=`
    <p class="first">On a January morning in 2026, the California College of the Arts confirmed what much of the Bay Area art world had been bracing for. After nearly a century and a half, the school — the region's last independent private college devoted to art and design — will close at the end of the 2026–27 academic year. Its San Francisco campus is to be sold to Vanderbilt University, which plans to run it as a West Coast outpost.</p>
    <p>The announcement did not come out of nowhere. Two years earlier, in January 2024, the Pennsylvania Academy of the Fine Arts, founded in 1805 and the oldest art school and museum in the country, voted to stop granting degrees, graduating its final class in the spring of 2025. The San Francisco Art Institute had already closed in 2022. The for-profit Art Institutes chain collapsed in 2023. The University of the Arts in Philadelphia shut its doors abruptly in 2024.</p>
    <p>Taken together, the closures amount to a reckoning for the independent art school as a model — long a fixture of American cultural life, and now among the most financially exposed corners of higher education.</p>
    <p class="sub">The numbers behind the closures</p>
    <p>The strain shows up first in enrollment and budgets. In explaining its decision, the California College of the Arts pointed to a deficit of roughly <strong>$20 million</strong> and enrollment that had fallen by about a third from its 2019 peak of some 1,800 students — a decline that a state grant and a costly campus renovation could not reverse. The Pennsylvania Academy had watched its enrollment fall by <strong>nearly half in a decade</strong>, from about 349 students to 178. Across the sector, the College Art Association counts roughly <strong>36 art colleges today, down from about 42 in the late 1990s.</strong></p>
    <p>The economics are unforgiving, said Jennifer Rissler, the association's president, and Deborah Obalil, who leads the Association of Independent Colleges of Art and Design. These schools tend to be small and heavily dependent on tuition, with thin endowments and little margin for error when a class arrives short. Art education is also expensive to deliver — studios, equipment, materials, small classes — and a stand-alone art school cannot spread those costs across cheaper lecture courses the way a large university can. They do not, as Ms. Obalil has put it, enjoy the savings that come with scale.</p>
    <p>Demand has shifted, too. A shrinking population of college-age students, parents increasingly wary of the price and career prospects of a fine-arts degree, and universities that market job placement have all steered applicants toward programs with clearer professional paths. Schools built solely around fine art, without design or architecture, have felt the pressure most acutely.</p>
    <p class="sub">A reorganization, more than a disappearance</p>
    <p>Yet the story is not simply one of loss. Increasingly, struggling art schools are being absorbed by universities rather than shuttered outright. The School of the Museum of Fine Arts joined Tufts. The Corcoran merged into George Washington University. Pacific Northwest College of Art became part of Willamette University. Vermont College of Fine Arts affiliated with CalArts. Now the California College of the Arts campus will carry on under Vanderbilt. Ms. Rissler has said she hopes such partnerships, rather than closures, become the sector's default.</p>
    <p>None of this, though, is a verdict on art schools themselves, and the causes vary from campus to campus. Some of the schools that closed were indeed small and thinly funded. The California College of the Arts was a different case: it enrolled some 1,800 students at its peak and ran on a budget of about $60 million. Its difficulties had more specific roots — a near-total reliance on tuition just as enrollment fell by a third, and a $97.5 million campus expansion whose bills came due as students grew scarcer, all in one of the most expensive cities in the country in which to run a school. Many of the largest and best-known art schools, meanwhile, remain robust, and their immersive, single-minded studio culture is something a university rarely matches. Nor is a university automatically the safer choice: a financially healthy campus is no guarantee that its art department is a priority, and university arts budgets face cuts of their own. The practical lesson is narrower — to weigh each school on its own footing, rather than by category.</p>
    <p>Something is lost all the same. Independent art schools were places organized entirely around making and questioning — institutions where, as Deborah Obalil of the Association of Independent Colleges of Art and Design puts it, free expression is part of the DNA. Because that is what these schools are built for, she argues, their steady disappearance is a signal worth reading: a measure of how much a society still makes room for it. Each one that closes narrows that space.</p>
    <div class="pull">Their closures, Ms. Obalil warns, can be "the canary in the coal mine" for how a society values free expression.</div>
    <p>The map of American art education is being redrawn, campus by campus. What endures, for the students still deciding where to apply, is older than any single institution: the work itself, the habit of looking closely, and the people willing to teach the next ones how. Those do not close.</p>`;

const ART_BODY_AI=`
    <p class="first">A student assembling a portfolio this year runs into a strange problem before submitting a single image: the schools cannot agree on what art even is anymore. Apply to the University of Michigan's Stamps School, and the instructions are blunt — work made with artificial intelligence <strong>cannot</strong> go in the portfolio. Apply to the Rhode Island School of Design, and the tone flips: the school says it <strong>embraces</strong> the ethical use of A.I. in the creative process, so long as you describe how and where you used it. Apply to the Savannah College of Art and Design, and the official portfolio pages say nothing about A.I. at all.</p>
    <p>In the span of one application season, generative image tools have gone from novelty to open question at the center of art admissions — and the schools are answering it in almost every possible way at once.</p>
    <p class="sub">A spectrum, not a rule</p>
    <p>At one end sits an outright ban. Michigan's Stamps School states plainly that A.I.-generated work is not permitted in the application portfolio. Near it, the College for Creative Studies in Detroit allows A.I. only for <strong>process and research</strong> — never as a final image — capping it at a single piece and requiring applicants to cite the prompts and platforms they used, and to keep other artists' names out of those prompts.</p>
    <p>A step over, the School of Visual Arts and Pratt Institute draw the same line in nearly identical language: images <strong>fully rendered</strong> by generative A.I. are prohibited, but A.I. tools used to <strong>enhance</strong> an otherwise original work are allowed — if the applicant discloses exactly which tools and prompts were involved. Both also bar A.I. text generators from the written application entirely.</p>
    <p>Further along are the schools that ask mainly for <strong>honesty</strong>. RISD, Parsons and CalArts all permit A.I. in some form but require you to disclose it; Parsons goes further, strongly recommending applicants not submit work created entirely by A.I., and reserving the right to ask for more materials if they do. CalArts warns that heavy A.I. use may trigger additional review. And then there is the far end of the spectrum — SCAD, the School of the Art Institute of Chicago, MICA and ArtCenter — whose public portfolio pages, as of this year, carry <strong>no explicit A.I. policy at all</strong>.</p>
    <p class="sub">What the schools say they are looking for</p>
    <p>Beneath the patchwork of rules is a striking amount of agreement about the stakes. Administrators keep returning to the idea that a portfolio is meant to show something a prompt cannot. Nate Harrison, dean of academic affairs at the School of the Museum of Fine Arts at Tufts, has said flatly that <strong>"we cannot fight A.I."</strong> — and argued that the job of an art school is to help students build a creative practice that can't be reduced to a text prompt. His colleague in admissions, Thomas Duncan, has pushed to treat a disclosed A.I. image not as a red flag but as a starting point for conversation.</p>
    <p>Others reach for history. Mike Essl, who leads the art school at Cooper Union, has compared the moment to <strong>"the birth of photography all over again,"</strong> and warned that limiting the tools available to artists is bad practice. It is a bet that image generators will be absorbed, as the camera was, rather than banned.</p>
    <p class="sub">The worries underneath</p>
    <p>Not everyone is sanguine. The most practical problem is verification: how does an admissions committee know whose hand made the work? Deborah Obalil, who leads the Association of Independent Colleges of Art and Design, has put it simply — this is the conversation right now, and <strong>"no one has the answer."</strong></p>
    <p>There are deeper concerns, too. The National Art Education Association, in a formal position statement, treats A.I. imagery submitted without attribution as a form of plagiarism, and warns that leaning too heavily on generators can dilute a young artist's understanding of the creative process and stunt the development of a personal voice. Skeptics go blunter still. The illustrator Molly Crabapple has argued that no one needs to take on art-school debt merely to type prompts into a generator — a challenge, in effect, to what an art education is for.</p>
    <div class="pull">"That is the conversation right now. And no one has the answer." — Deborah Obalil, president of the Association of Independent Colleges of Art and Design</div>
    <p class="sub">Adapting, not just policing</p>
    <p>The more optimistic camp is busy building rather than banning. MassArt and CalArts have partnered on courses in "A.I. in creative practice." SVA's institutional guidelines frame generative A.I. as "a means, not an end" — useful for augmenting a studio practice, never a substitute for the work of exploration — while still demanding full transparency about tools and prompts. At Ringling College, an A.I. coordinator sums up the pitch to students in a line now heard across studios: A.I. won't replace you, but someone who knows how to use it might.</p>
    <p>Even the machinery of admissions is shifting. The School of the Art Institute of Chicago won a grant to bring A.I. and data analysis into its admissions operation — though, notably, to help with access and planning, not to judge portfolios. The human read of the artwork, for now, stays human.</p>
    <p class="sub">What it means if you're applying</p>
    <p>For a student, the takeaway is less about taking sides than about paying attention. Because the rules genuinely differ from school to school, the only safe move is to <strong>read each school's own policy before you submit</strong>, and, wherever A.I. touched a piece, to <strong>disclose it plainly</strong> — the schools that allow A.I. almost all require exactly that, and the ones that ban it are increasingly on the lookout.</p>
    <p>The through-line, from the strictest ban to the warmest embrace, is the same. What admissions officers keep saying they want to see is evidence of a person behind the work — observation, process, a point of view that developed over time. That is the part a prompt still can't fake, and, for now, the part a portfolio is being asked to prove.</p>`;

  }
  function select(name){const url=schoolReqUrl(name);if(url){window.open(url,'_blank','noopener');}else{toast('Official page coming soon — '+name,'🔗');}close();}

    wireOpts();
  }
  input.onfocus=()=>{open();const q=input.value.trim();q?renderResults(q):renderDefault();};
  input.oninput=()=>{open();const q=input.value.trim();q?renderResults(q):renderDefault();};
  input.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();if(items.length){hi=Math.min(items.length-1,hi+1);paintHi();}}
    else if(e.key==='ArrowUp'){e.preventDefault();if(items.length){hi=Math.max(0,hi-1);paintHi();}}
    else if(e.key==='Enter'){if(hi>=0&&items[hi]){e.preventDefault();select(items[hi][0]);}}
    else if(e.key==='Escape'){close();input.blur();}
  };
  input.onblur=()=>{setTimeout(close,140);};
}

      <p class="gd-lede">You can study art &amp; design at a dedicated art school (like RISD or SCAD) or inside a university (like Carnegie Mellon, UCLA, or the University of Michigan). How you apply — and what carries the weight — is quite different.</p>
      <div class="gd-body">
        <h2>At a standalone art school</h2>
        <p>You apply to the art school directly, and the <strong>portfolio is usually the heart of it.</strong> Academics still matter, but the work carries the most weight, and the whole application is built around it.</p>
        <h2>At a university</h2>
        <p>You apply to the <strong>university first</strong>, on its standard academic terms — GPA, transcript, essays, and sometimes test scores — and then submit a <strong>portfolio separately</strong>. The portfolio is one important part of a bigger application, and how much it counts varies enormously: the University of Michigan says the portfolio is <strong>50% of the decision</strong>, while Yale sits at the opposite end — a portfolio is <strong>not required for admission</strong> at all. You're admitted to Yale on academic merit, and you enter the art major later through a <strong>sophomore review</strong> — a faculty evaluation of the work you've made in Yale studio courses, not a portfolio you submit.</p>
        <h2>What this means for you</h2>
        <p>Two practical takeaways. First, for university programs, <strong>don't neglect academics</strong> — grades and essays can count in a way they may not at a standalone art school. Second, because the portfolio's weight and rules differ so much between schools — and even between programs within one university — <strong>read each school's own page</strong> before you build for it.</p>

  const steps=[['🔎','Find your expert','Search people who got in, or who do the work now.'],['📅','Book a session','Pick a time that fits you and your expert.'],['🎥','Meet virtually','Talk face to face over a secure video call.'],['✨','Get clarity','Leave with real answers and next steps.']];
  const faqs=[['What can I expect from a session?','A focused 1:1 video call where you can ask anything — bring your portfolio, your questions, or just your uncertainty.'],['How long are sessions?','15, 30, or 60 minutes — you choose when you book.'],['What if I need to reschedule?','You can reschedule up to 24 hours before your session.'],['Is payment safe?','Payment is handled securely and released after your session. (Prototype — no real payment yet.)']];
  return `<div class="wrap" style="max-width:1000px">
    <div class="breadcrumb"><a data-go="experts">Experts</a> <span>›</span> <span>${esc(e.name)}</span></div>
    <div class="exd-grid">
      <div class="card card-pad">
        <div class="row" style="gap:16px"><img class="avatar" width="72" height="72" src="${avatarUrl({name:e.name})}"/><div><div style="font-size:22px;font-weight:800">${esc(e.name)}</div><div style="color:var(--ink-2);font-weight:600">${esc(e.role)}</div><div style="color:${blue?'var(--red)':'var(--accent)'};font-size:14px;font-weight:600">${esc(e.company)}</div></div></div>
        <div class="ex-tags" style="margin-top:14px">${e.tags.map(t=>`<span class="ex-chip">${esc(t)}</span>`).join('')}</div>
        <p style="color:var(--ink-2);line-height:1.7;margin-top:16px">${esc(e.bio)}</p>
        <h3 style="font-size:16px;font-weight:800;margin-top:24px">What you will get from this session</h3>
        <div class="exd-gets">${e.gets.map(g=>`<div class="exd-get"><span>✓</span>${esc(g)}</div>`).join('')}</div>
      </div>
      <aside class="exd-book"><div class="card card-pad bk-card${blue?' bk-red':''}">${bookingCardInner(e)}</div></aside>
    </div>
    <section class="exd-how">
      <h2 style="text-align:center;font-size:22px;font-weight:800">How it works</h2>
      <div class="exd-steps">${steps.map(st=>`<div class="exd-step"><div style="font-weight:700">${st[1]}</div><p style="color:var(--ink-2);font-size:13.5px;margin-top:4px">${st[2]}</p></div>`).join('')}</div>
    </section>
    <section style="margin:36px auto 0;max-width:760px">
      <h2 style="font-size:20px;font-weight:800;margin-bottom:10px">Frequently asked questions</h2>
      ${faqs.map(fq=>`<details class="faq"><summary>${fq[0]}</summary><p>${fq[1]}</p></details>`).join('')}
    </section>
  </div>`;
}

const A2_FAQ=[{"q":"Doesn't looking at others' work make you less original?","a":"Every artist learns by looking — from museum master-copies to studio critiques. Lukumo doesn't hand you someone else's art to copy; it demystifies the one thing that stays hidden: what an admissions portfolio actually needs to be. You see the real bar, hear the maker's thinking, then build your own work — the personal voice that's the only thing that actually gets you in (and the one thing AI can't fake)."},{"q":"Are these really accepted portfolios — and how do you know?","a":"Yes. Every portfolio on Lukumo comes from a real student who was accepted, and we verify that before it's shown — these aren't anonymous posts scraped from the internet. Each is organized by school and major, with the maker's own reflections on what worked."},{"q":"How is this different from Googling portfolios or Pinterest?","a":"Those show you pretty pictures with no context — you can't tell what's real, what got in where, or why. Lukumo is organized by school and major, every portfolio is verified as accepted, and you can read the maker's thinking and even talk to them directly."},{"q":"Is Lukumo free?","a":"Yes — joining and browsing real accepted portfolios is free. Some things are paid: 1:1 sessions with mentors and experts, where you set up time with someone who's been there. You'll always see the price up front, and many offer a free intro."},{"q":"Can I really talk to the people who got in?","a":"That's the heart of it. Beyond seeing portfolios, you can book a 1:1 session with the students, grads, and working pros behind them — the guidance most applicants never get access to."},{"q":"Can I use AI in my portfolio?","a":"It depends entirely on the school — policies range from outright bans to \"allowed if you disclose it.\" We keep a plain-language guide to what each school requires, and the rule of thumb is simple: read your schools' policies, and disclose any AI you used. What schools keep asking for is the part AI can't fake — your process, observation, and voice."},{"q":"My school isn't on Lukumo — can you add it?","a":"Almost certainly. You can search across a growing list of art schools and university programs, and if yours isn't there yet, request it — we add schools as students look for them."},{"q":"Will Lukumo help me get in — or guarantee it?","a":"No one can honestly guarantee admission, and we won't pretend to. What we give you is real: verified examples of what actually got in, honest guidance from people who did it, and the community to not go it alone. The work is still yours — we just make the path clearer."},{"q":"Is my own work private?","a":"Yes, by default. When you upload your work-in-progress, it's private — visible only to you and anyone you choose to share it with, like a mentor. You decide if and when to make anything public. (This matters especially for younger students.)"}];

function viewAbout(){
  const doItems=[

        <h1>Real portfolios.<br>Real people.<br>Real <span class="hl hl-purple">inspiration.</span></h1>

        <div class="a2-split-txt">

        <div class="a2-fside">

          <div class="rl">Founder of Lukumo</div>
        </div>
        <div class="a2-fbody">
          <p>For 10 years I worked as an art-admissions consultant, sitting beside students as they tried to figure out how to get into art &amp; design school. I actually designed and built the very first version of this platform a decade ago &mdash; but other work pulled me away, and I set it aside before it was ever finished.</p>

function foundingBadge(u){return (u&&u.founding)?'<span class="founding-badge">Founding</span>':'';}
function verifiedBadge(){return '<span class="verified-badge">✓ Verified</span>';}
function goldMentorBadge(){return '<span class="verified-badge gold">✓ Gold Mentor</span>';}
/* ---- B3 badge system ---- */
function userHasPortfolio(u){return !!u&&DB.portfolios.some(p=>p.ownerId===u.id);}
function isGoldMentor(u){return !!u&&u.role==='accepted'&&!!u.verified&&userHasPortfolio(u);}
function mentorTierBadge(u){if(!u||!u.verified)return '';return isGoldMentor(u)?goldMentorBadge():verifiedBadge();}
const SCHOOL_ABBR={'Rhode Island School of Design':'RISD','School of Visual Arts':'SVA','School of the Art Institute of Chicago':'SAIC','ArtCenter College of Design':'ArtCenter','California Institute of the Arts':'CalArts','Maryland Institute College of Art':'MICA','Savannah College of Art and Design':'SCAD','Massachusetts College of Art and Design':'MassArt','Pratt Institute':'Pratt','Parsons School of Design':'Parsons','Fashion Institute of Technology':'FIT','Rochester Institute of Technology':'RIT','Ringling College of Art and Design':'Ringling','Otis College of Art and Design':'Otis','Kansas City Art Institute':'KCAI','Cleveland Institute of Art':'CIA','Columbus College of Art and Design':'CCAD','Minneapolis College of Art and Design':'MCAD','Pacific Northwest College of Art':'PNCA','Cranbrook Academy of Art':'Cranbrook','New York University':'NYU','Carnegie Mellon University':'CMU','University of California, Los Angeles':'UCLA','Yale University':'Yale','Cornell University':'Cornell','Alfred University':'Alfred','Arizona State University':'ASU'};
function schoolAbbr(name){name=String(name||'');if(SCHOOL_ABBR[name])return SCHOOL_ABBR[name];const stop={of:1,the:1,and:1,'&':1,at:1,for:1,de:1};const words=name.replace(/[.,]/g,'').split(/\s+/).filter(Boolean);const sig=words.filter(w=>!stop[w.toLowerCase()]);if(sig.length===1)return sig[0].length>10?sig[0].slice(0,10):sig[0];if(sig.length>=2&&sig.length<=4)return sig.map(w=>w[0].toUpperCase()).join('');return (sig[0]||name).slice(0,10);}
function yr2(y){y=String(y||'');const m=y.match(/(\d{2})(?!.*\d)/);return m?"’"+m[1]:'';}
function schoolBadge(p){const ab=schoolAbbr(p.school);if(!ab)return '';const y=yr2(p.yearAccepted);return `<span class="cbadge cb-school">${esc(ab)}${y?' '+y:''}</span>`;}
function isNewPortfolio(p){return (Date.now()-(p.createdAt||0))<7*864e5;}
function newBadge(){return '<span class="cbadge cb-new">New</span>';}
function levelBadge(p){const g=(p.level==='Graduate');return `<span class="cbadge cb-level${g?' grad':''}">${g?'Grad':'Undergrad'}</span>`;}
function foundingRank(p){const u=userById(p.ownerId);return (u&&u.founding)?0:1;}
/* ---- achievements ---- */
function achEmblem(a){const earned=a.earned&&!a.locked;const cls=earned?('ach-earned '+(a.tone||'')):'ach-locked';return `<div class="ach ${cls}"><div class="ach-emb">${a.icon}</div><div class="ach-lbl">${esc(a.label)}</div>${a.note?`<div class="ach-note">${esc(a.note)}</div>`:''}</div>`;}
function achievementsGrid(list,title,sub,opt){opt=opt||{};let items=list;if(opt.earnedOnly)items=list.filter(a=>a.earned&&!a.locked);if(opt.earnedOnly&&!items.length)return '';return `<div class="card card-pad mt16"><div class="ach-sec-head">🏅 ${esc(title)}</div>${sub?`<div class="ach-sec-sub">${esc(sub)}</div>`:''}<div class="ach-grid">${items.map(achEmblem).join('')}</div></div>`;}
function toggleFollow(uid){const cur=me();if(!cur){toast('Log in to follow','♡');go('signup');return;}cur.following=cur.following||[];const i=cur.following.indexOf(uid);if(i>=0)cur.following.splice(i,1);else cur.following.push(uid);save();render();}
function toggleSaveMentor(pid){const cur=me();if(!cur){toast('Log in to save','☆');go('signup');return;}cur.saved=cur.saved||[];const i=cur.saved.indexOf(pid);if(i>=0){cur.saved.splice(i,1);toast('Removed from folder');}else{cur.saved.push(pid);toast('Saved to folder');}save();render();}
function mentorUpcoming(u){
  const names=['Jamie L.','Soo-min K.','Alex R.','Priya S.','Noah T.','Elena M.','Daniel P.','Yuki N.'];
  const days=['Mon','Tue','Wed','Thu','Fri','Sat'];
  const n=1+hashN(u.id+'up')%3;const out=[];
  for(let i=0;i<n;i++){const h=hashN(u.id+'u'+i);const mins=[30,60,120][h%3];out.push({student:names[(h+i)%names.length],day:days[h%days.length],time:(9+h%9)+':00',mins:mins,price:[25,40,70][h%3]});}
  return out;
}
function mentorSessionsPanel(u){
  const ms=mentorStats(u);
  const real=(DB.bookings||[]).filter(b=>b.providerId==='m_'+u.id).map(b=>{const dt=new Date(b.date+'T00:00');return {student:(userById(b.studentId)||{}).name?tc(userById(b.studentId).name):'A student',day:dt.toLocaleDateString('en-US',{weekday:'short'}),time:b.time,mins:b.mins,price:b.price};});
  const up=real.concat(mentorUpcoming(u)).slice(0,4);
  const list=up.map(b=>`<div class="msess-row"><div><div class="who">${esc(b.student)}</div><div class="when">${durLabel(b.mins)} · ${b.day} ${b.time}</div></div><div class="pay">$${b.price}<div style="font-weight:600;color:var(--accent);font-size:12px;margin-top:2px">confirmed</div></div></div>`).join('');
  return `<div class="card card-pad mt16">
    <div class="ach-sec-head">📅 My sessions</div>
    <div class="ach-sec-sub">Students book 1:1 time with you · prototype (no real payment yet)</div>
    <div class="msess-tiles">
      <div class="msess-tile"><div class="n">${up.length}</div><div class="l">Upcoming</div></div>
      <div class="msess-tile"><div class="n">${ms.sessions}</div><div class="l">Completed</div></div>
      <div class="msess-tile"><div class="n">★ ${ms.rating.toFixed(1)}</div><div class="l">Rating</div></div>
    </div>
    <div style="margin-top:16px">${up.length?list:`<div class="empty">No upcoming sessions yet.</div>`}</div>
    <button class="btn btn-outline btn-sm" data-go="sessions" style="margin-top:14px">See all sessions</button>
  </div>`;
}
function mentorStats(u){
  const p=portfoliosByOwner(u.id)[0];
  const s=u.id;
  const views=p?(48000+hashN(p.id+'v')%420000):(1200+hashN(s+'v')%40000);
  const followers=180+hashN(s+'flw')%3200;
  const savedBy=90+hashN(s+'sav')%1400;
  const rating=Math.min(5.0, (u.verified?4.7:4.3)+(hashN(s+'rat')%30)/100);
  const sessions=8+hashN(s+'ses')%140;
  const pieces=(p&&p.projects&&p.projects.length)?p.projects.length:(2+hashN(s+'pc')%5);
  const abbrs=Object.keys(SCHOOL_ABBR).map(k=>SCHOOL_ABBR[k]).filter(a=>a!==schoolAbbr(u.school));
  let also='';
  if(abbrs.length>=2){const a1=abbrs[hashN(s+'a1')%abbrs.length];let a2=abbrs[hashN(s+'a2')%abbrs.length];if(a2===a1)a2=abbrs[(hashN(s+'a2')+1)%abbrs.length];also=a1+' · '+a2;}
  const year=(p&&p.yearAccepted)||u.gradYear||'';
  return {views,followers,savedBy,rating,sessions,pieces,also,year,pid:p?p.id:null};
}

  const schoolsStarted=!!((u.trackedSchools&&u.trackedSchools.length)||(u.targetSchools&&u.targetSchools.length));
  const savedRefs=(u.saved||[]).length>0;
  const uploadedWork=!!(u.myWork&&u.myWork.length>0);
  return [
    {done:true,txt:'Joined Lukumo — Explore mode'},
    grad?{done:profileSet,txt:'Add your degree background',cta:profileSet?null:['editProfile','Add']}
        :{done:profileSet,txt:'Set up your profile',cta:profileSet?null:['editProfile','Set up']},
    {done:schoolsStarted,txt:'Start your My Schools list',cta:schoolsStarted?null:['folder','Open']},

function applicantEmblems(u){
  const prog=applicantProgress(u);const done=prog.filter(s=>s.done).length,total=prog.length;
  const schools=!!((u.trackedSchools&&u.trackedSchools.length)||(u.targetSchools&&u.targetSchools.length));
  const profileSet=!!(u.bio||u.avatar||u.priorDegree);
  const work=!!(u.myWork&&u.myWork.length>0);
  const booked=(DB.bookings||[]).some(b=>b.studentId===u.id);
  return [
    {icon:'🗂️',earned:schools},
    {icon:'✎',earned:profileSet},
    {icon:'🧭',journey:true,done:done,total:total,steps:prog},
    {icon:'🎨',earned:work,locked:!work},
    {icon:'🎓',earned:false,locked:true},

    const pct=Math.round(e.done/e.total*100);
    return `<div class="ap-mem-ring" data-ap-explorer style="background:conic-gradient(var(--accent) ${pct}%,#e6e8ee 0)"><div class="ap-mem-in">${e.icon}</div><span class="ap-pc">${e.done}/${e.total}</span></div>`;

function fileToDataURL(f,max){return new Promise(res=>{
  const rd=new FileReader();
  rd.onload=()=>{
    const raw=rd.result;
    if(typeof raw!=='string'||!/^data:image\/(png|jpe?g|webp)/i.test(raw)){res(raw);return;}
    const img=new Image();
    img.onload=()=>{
      try{
        const M=max||1280;
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h){res(raw);return;}
        const sc=Math.min(1,M/Math.max(w,h));
        w=Math.round(w*sc);h=Math.round(h*sc);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        const out=c.toDataURL('image/jpeg',0.82);
        res(out&&out.length<raw.length?out:raw);
      }catch(e){res(raw);}
    };
    img.onerror=()=>res(raw);
    img.src=raw;
  };
  rd.readAsDataURL(f);
});}

  ov.innerHTML='<div class="su-card"><button class="su-x" data-sg-x aria-label="Close">\u00d7</button>'+
    '<div class="su-brand">'+brandInner()+'</div>'+
    '<h3>See what got them in</h3>'+
    '<p>Create a free account to browse real accepted portfolios, follow how they were built, and save your favorites to your own admissions folder.</p>'+
    '<button class="btn btn-primary btn-lg" data-sg-signup>Sign up free</button>'+
    '<div class="su-alt">Already have an account? <a data-sg-login>Log in</a></div></div>';
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  ov.querySelector('[data-sg-x]').onclick=close;
  ov.querySelector('[data-sg-signup]').onclick=()=>{close();go('signup');};
  ov.querySelector('[data-sg-login]').onclick=()=>{close();go('login');};}
window.addEventListener('scroll',()=>{
  if(sgShown||me()||['login','signup','onboard'].includes(route.name)){sgPrevY=window.scrollY;return;}
  const y=window.scrollY,t=Date.now();
  if(y>sgPrevY&&t-sgLastT>500){sgLastT=t;sgCount++;if(sgCount>=4)showSignupGate();}
  sgPrevY=y;
},{passive:true});

if(location.hash&&location.hash!=='#'&&location.hash!=='#/')route=hashToRoute();
render();
</script>
</body>
</html>
